[package]
name = "textlint-v8"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
cli = ["dep:anyhow", "dep:clap"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.6", features = ["derive"], optional = true }
flate2 = "1.1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
v8 = "=152.2.0"

[build-dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
deno_config = { version = "0.108.0", default-features = false }
deno_error = "=0.7.1"
deno_npm_cache = "0.77.0"
deno_npm_installer = "0.53.0"
deno_npmrc = "0.19.0"
deno_resolver = "0.89.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
rolldown = { version = "=1.2.6", default-features = false }
rolldown_common = { version = "=1.2.6", default-features = false }
semver = "1.0.28"
serde_json = "1.0.151"
sys_traits = "0.1.28"
tokio = { version = "1.53.1", features = ["rt"] }
url = "2.5.8"

[dev-dependencies]
static_assertions = "1.1.0"

[[bin]]
name = "textlint-v8"
path = "src/main.rs"
required-features = ["cli"]

[profile.dev]
opt-level = 1

[profile.release]
lto = true
strip = true
