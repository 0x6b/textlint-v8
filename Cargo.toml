[package]
name = "textlint-v8"
version = "0.1.0"
edition = "2024"
description = "Standalone textlint runner powered by V8 with an opinionated set of embedded rules"
license = "MIT"
repository = "https://github.com/0x6b/textlint-v8"
homepage = "https://github.com/0x6b/textlint-v8"
documentation = "https://docs.rs/textlint-v8"
readme = "README.md"
keywords = ["textlint", "lint", "markdown", "v8", "japanese"]
categories = ["command-line-utilities", "development-tools", "text-processing"]

[features]
default = ["cli"]
cli = ["dep:anyhow", "dep:clap"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
flate2 = "1.1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
v8 = "=152.2.0"

[build-dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
deno_config = { version = "0.109.0", default-features = false }
deno_error = "=0.7.1"
deno_npm_cache = "0.78.0"
deno_npm_installer = "0.54.0"
deno_npmrc = "0.20.0"
deno_resolver = "0.90.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rolldown = { version = "=1.2.9", default-features = false }
rolldown_common = { version = "=1.2.9", default-features = false }
semver = "1.0.28"
serde_json = "1.0.151"
sys_traits = "0.1.28"
tokio = { version = "1.53.1", features = ["rt"] }
url = "2.5.8"

[dev-dependencies]
static_assertions = "1.1.0"

[package.metadata.docs.rs]
no-default-features = true

[[bin]]
name = "textlint-v8"
path = "src/main.rs"
required-features = ["cli"]

[profile.dev]
opt-level = 1

[profile.release]
lto = true
strip = true
