name: Build npm packages

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
            binary: target/release/textlint-v8
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            binary: target/release/textlint-v8
          - runner: macos-15
            platform: darwin-arm64
            binary: target/release/textlint-v8
          - runner: windows-2025
            platform: win32-x64
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/textlint-v8.exe
          - runner: windows-11-arm
            platform: win32-arm64
            target: aarch64-pc-windows-msvc
            binary: target/aarch64-pc-windows-msvc/release/textlint-v8.exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          architecture: ${{ endsWith(matrix.platform, 'arm64') && 'arm64' || 'x64' }}

      - name: Build native binary
        if: runner.os != 'Windows'
        run: cargo build --release --locked

      - name: Build Windows native binary with static CRT
        if: runner.os == 'Windows'
        run: |
          rustup target add '${{ matrix.target }}'
          cargo build --release --locked --target '${{ matrix.target }}'
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
          CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static

      - name: Test packed install and npx
        run: node --test build/package.test.mjs
        env:
          TEXTLINT_V8_BINARY: ${{ matrix.binary }}

      - name: Pack distribution artifacts
        run: |
          node build/package.mjs '${{ matrix.platform }}' '${{ matrix.binary }}' target/npm
          mkdir -p target/npm-tarballs
          npm pack ./target/npm/textlint-v8 --pack-destination target/npm-tarballs --ignore-scripts
          npm pack './target/npm/textlint-v8-${{ matrix.platform }}' --pack-destination target/npm-tarballs --ignore-scripts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-${{ matrix.platform }}
          path: target/npm-tarballs/*.tgz
          if-no-files-found: error
